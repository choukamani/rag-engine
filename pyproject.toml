[project]
name = "rag-engine"
version = "0.1.0"
description = "Retrieval-augmented generation engine with swappable LLM, embedding and vector-store providers (ports & adapters), BM25 / dense / hybrid retrieval and a reproducible evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amani Chouk", email = "amanichouk6@gmail.com" }]
keywords = ["rag", "retrieval", "pgvector", "bm25", "hybrid-search", "llm", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2", "pgvector>=0.3"]
local-embeddings = ["fastembed>=0.4"]

[project.scripts]
rag-eval = "rag_engine.evaluation.cli:main"

[dependency-groups]
dev = [
    "rag-engine[postgres]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks", "scripts", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "RET", "ARG", "PL", "TRY", "S"]
ignore = [
    "PLR0913",
    "TRY003",
    "PLC0415", # lazy imports keep optional extras (postgres, fastembed) optional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
"benchmarks/**" = ["T201", "PLR2004"]
"src/rag_engine/evaluation/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "benchmarks", "scripts", "evaluation"]
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*", "snowballstemmer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_engine --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "integration: end-to-end tests across adapters",
    "postgres: needs a PostgreSQL + pgvector database (RAG_TEST_DATABASE_URL)",
]

[tool.coverage.run]
branch = true
source = ["rag_engine"]
