name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests (with pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 20
    env:
      RAG_TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov-report=xml
      - name: Retrieval evaluation (Nimbus)
        run: uv run rag-eval --dataset nimbus | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Docker build + end-to-end smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rag-engine:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack and seed the corpus
        run: |
          docker compose up -d --no-build --wait postgres api
          docker compose run --rm seed
      - name: Ask a question
        run: |
          curl -sf localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "How much does the Plus plan cost?"}' | tee answer.json
          grep -q '"grounded":true' answer.json
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
